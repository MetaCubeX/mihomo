name: Provenance Smoke Test

on:
  workflow_dispatch:

jobs:
  attest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create smoke artifact
        run: |
          mkdir -p dist
          printf 'provenance smoke test\n' > dist/provenance-smoke.txt

      - name: Upload smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: provenance-smoke
          path: dist/provenance-smoke.txt

      - name: Attest smoke artifact
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/provenance-smoke.txt
